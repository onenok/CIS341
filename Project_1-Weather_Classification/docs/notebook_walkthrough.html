              ds = ds.map(_augment, num_parallel_calls=tf.data.AUTOTUNE)
          ds = ds.map(lambda x, y_: (spec.fn(x), y_),   # ← 唯一的縮放點
                      num_parallel_calls=tf.data.AUTOTUNE)
          return ds.batch(batch_size).prefetch(tf.data.AUTOTUNE)`,

        lib_build_index: `for path, label in paths:
          info = hashes.get(str(path), {})
          group = None
          if info.get("md5"):
              group = by_md5.get(info["md5"])          # ① 位元級完全相同
          if group is None and info.get("ahash"):
              for rep in reps:
                  if (_hamming(info["ahash"], rep["a"]) <= dup_threshold
                                  and _hamming(info["dhash"], rep["d"]) <= dup_threshold_d
                                  and pixel_diff(path, rep["path"]) <= pixel_threshold):
                      group = rep["group"]             # ② 雙雜湊 + ③ 像素差異
                      break
          if group is None:
              counters[label] = counters.get(label, 0) + 1
              group = f"{label}_{counters[label]:04d}"  # 全域分配 → 跨類也不會被拆開
              reps.append({..., "group": group, "path": path})`,
      };

      /* ══════════════════════════════════════════════════════════════════
         應用程式
         ══════════════════════════════════════════════════════════════════ */
      const $ = (s, r = document) => r.querySelector(s);
      const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
      const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;');

      /* ---------- 小型 SVG 折線圖 ---------- */
      function lineChart(host, cfg) {
        const series = cfg.series;
        const n = Math.max(...series.map(s => s.data.length));
        const W = 780, H = cfg.height || 260;
        const P = { l: 46, r: 16, t: 18, b: 34 };
        const iw = W - P.l - P.r, ih = H - P.t - P.b;
        const yMin = cfg.yMin != null ? cfg.yMin : 0;
        const yMax = cfg.yMax != null ? cfg.yMax : 1;
        const x = i => P.l + (n <= 1 ? 0 : (i / (n - 1)) * iw);
        const y = v => P.t + ih - ((v - yMin) / (yMax - yMin)) * ih;

        const grid = [0, .25, .5, .75, 1].map(f => {
          const val = yMin + (yMax - yMin) * f;
          return `<line x1="${P.l}" y1="${y(val).toFixed(1)}" x2="${W - P.r}" y2="${y(val).toFixed(1)}"
                    stroke="#1c2740" stroke-width="1"/>
                  <text x="${P.l - 8}" y="${(y(val) + 4).toFixed(1)}" text-anchor="end"
                    fill="#5b7096" font-size="10" font-family="monospace">${val.toFixed(2)}</text>`;
        }).join('');

        const xTicks = [];
        for (let i = 0; i < n; i += Math.max(1, Math.ceil(n / 10))) {
          xTicks.push(`<text x="${x(i).toFixed(1)}" y="${H - 12}" text-anchor="middle"
            fill="#5b7096" font-size="10" font-family="monospace">${i + 1}</text>`);
        }

        const paths = series.map(s => {
          const d = s.data.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
          return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2}"
                    stroke-linejoin="round" stroke-linecap="round" opacity="${s.opacity ?? 1}">
                    <animate attributeName="stroke-dasharray" from="0,2000" to="2000,0" dur="0.6s" fill="freeze"/>
                  </path>`;
        }).join('');

        const dots = series.map(s => s.data.map((v, i) =>
          `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.6" fill="#0d1424"
             stroke="${s.color}" stroke-width="1.6"/>`).join('')).join('');

        const marker = cfg.mark
          ? `<line x1="${x(cfg.mark - 1).toFixed(1)}" y1="${P.t}" x2="${x(cfg.mark - 1).toFixed(1)}"
               y2="${P.t + ih}" stroke="${cfg.markColor || '#fbbf24'}" stroke-width="1"
               stroke-dasharray="4 4" opacity=".55"/>
             <text x="${x(cfg.mark - 1).toFixed(1)}" y="${P.t - 4}" text-anchor="middle"
               fill="${cfg.markColor || '#fbbf24'}" font-size="10">best ep ${cfg.mark}</text>`
          : '';

        host.innerHTML = `
          <svg viewBox="0 0 ${W} ${H}" class="w-full" style="max-height:${H}px">
            ${grid}${paths}${dots}${marker}${xTicks.join('')}
            <text x="${W / 2}" y="${H - 1}" text-anchor="middle" fill="#465a7d" font-size="10">epoch</text>
          </svg>
          <div class="mt-2 flex flex-wrap items-center gap-3 text-[11px]">
            ${series.map(s => `<span class="flex items-center gap-1.5 text-slate-400">
              <span class="inline-block h-0.5 w-4 rounded" style="background:${s.color}"></span>${s.label}</span>`).join('')}
          </div>`;
      }

              <span class="font-mono text-slate-300">${r.label}</span>
              <span class="text-slate-500">${r.files} 張 <span class="text-slate-700">·</span> train ${r.train} / val ${r.val}</span>

      /* ---------- 分頁切換 ---------- */
      let currentTab = 'nb';
      function setTab(tab) {
        currentTab = tab;
        $('#tab-nb').classList.toggle('hidden', tab !== 'nb');
        $('#tab-lib').classList.toggle('hidden', tab !== 'lib');
        $$('#tabs .tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
        $('#search').placeholder = tab === 'nb'
          ? '搜尋章節、cell、關鍵字…（按 / 聚焦）'
          : '搜尋函式名、功能域、關鍵字…（按 / 聚焦）';
        doSearch($('#search').value);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      /* ---------- 搜尋 ---------- */
      function doSearch(q) {
        const term = (q || '').trim().toLowerCase();
        const root = currentTab === 'nb' ? $('#nb-content') : $('#lib-content');
        const sections = $$('section', root);

        if (!term) {
          $$('[data-search]', root).forEach(el => el.classList.remove('hidden'));
          $('#searchCount').textContent = '';
          return;
        }

        let hits = 0;
        sections.forEach(s => {
          const sectionHit = (s.dataset.search || '').includes(term);
          let anyCard = false;
          $$('article', s).forEach(c => {
            const hit = sectionHit || (c.dataset.search || '').includes(term);
            c.classList.toggle('hidden', !hit);
            if (hit) { anyCard = true; hits++; }
          });
          s.classList.toggle('hidden', !anyCard);
        });
        $('#searchCount').textContent = hits ? `${hits} 項符合` : '無結果';
      }

      /* ---------- 側欄導覽 ---------- */
      function bindNav() {
        document.addEventListener('click', (e) => {
          const tb = e.target.closest('#tabs .tab-btn');
          if (tb) { setTab(tb.dataset.tab); return; }

          const nb = e.target.closest('[data-goto]');
          if (nb) {
            const el = document.getElementById(nb.dataset.goto);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            $$('.nav-btn').forEach(b => b.classList.toggle('active', b === nb));
            return;
          }
        });
      }

      /* ---------- 滾動時高亮側欄 ---------- */
      function bindScrollSpy() {
        const map = { nb: NB.map(c => c.id), lib: LIB.map(g => g.id) };

          const ids = map[currentTab] || [];
          let active = ids[0];
          for (const id of ids) {
            const el = document.getElementById(id);
            if (el && el.getBoundingClientRect().top <= 180) active = id;
          }
          $$('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.goto === active));
        }, { passive: true });
      }

      /* ---------- 鍵盤 ---------- */
      function bindKeys() {
        document.addEventListener('keydown', (e) => {
          const inInput = ['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName);
          if (e.key === '/' && !inInput) { e.preventDefault(); $('#search').focus(); return; }
          if (e.key === 'Escape') { $('#search').value = ''; doSearch(''); $('#search').blur(); return; }
          if (inInput) return;
          if (e.key === '1') setTab('nb');
          if (e.key === '2') setTab('lib');
        });
        $('#search').addEventListener('input', (e) => doSearch(e.target.value));
      }

      /* ---------- 啟動 ---------- */
      renderKPI();
      renderNB();
      renderLIB();
      bindNav();
      bindScrollSpy();
      bindKeys();
      setTab('nb');
      $('#search').value = '';
      $('#searchCount').textContent = '';

      // 初次進入時側欄高亮第一章
      $$('.nav-btn').forEach(b => b.classList.remove('active'));
      $$('#nb-nav .nav-btn')[0]?.classList.add('active');
</script>
</body>
</html>
